<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Batman</title>
    <link href="./src/output.css" rel="stylesheet">
</head>
<body class=" bg-gotham-green">
    <!-- NAVBAR -->
    <header class="border-b border-black">
        <nav class="flex relative items-center justify-between px-4 py-3 z-20">
            <span class="font-primary uppercase tracking-widest font-bold text-sm">The Batman</span>
            <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2"><img src="./images/DC-PNG.png" alt="LogoDC" class="h-8 w-auto"></div>
            <button id="menu-btn">
                <img src="./images/menu-open.svg" alt="MenuAbierto" class="h-6 w-6" id="menu-icon">
            </button>
        </nav>
        <div id="menu" class="absolute w-full flex flex-col bg-gotham-blue px-4 py-6 gap-4 transform -translate-y-full opacity-0 pointer-events-none transition-all duration-300 ease-out">
            <a href="#" class="uppercase tracking-wide text-sm font-primary underline cursor-pointer">Inicio</a>
            <a href="#" class="uppercase tracking-wide text-sm font-primary underline cursor-pointer">Historia</a>
            <a href="#" class="uppercase tracking-wide text-sm font-primary underline cursor-pointer">Gotham</a>
        </div>
    </header>
    <div id="overlay" class="fixed inset-0 bg-black/70 opacity-0 pointer-events-none transition-opacity z-10"></div>
    </body>


    <script>
        const menuBtn = document.getElementById("menu-btn");
        const menu = document.getElementById("menu");
        const icon = document.getElementById("menu-icon");

        let isOpen = false;

        menuBtn.addEventListener("click", () => {
            isOpen = !isOpen;

            if (isOpen) {
                menu.classList.remove("-translate-y-full","opacity-0","pointer-events-none");
                menu.classList.add("translate-y-0", "opacity-100");

                icon.src = "./images/menu-close.svg";
                icon.alt = "Cerrar menú";
            } else {
                menu.classList.add("-translate-y-full","opacity-0","pointer-events-none");
                menu.classList.remove("translate-y-0","opacity-100");
                icon.src = "./images/menu-open.svg";
                icon.alt = "Abrir menú";
            }
        });
    </script>
</html>
